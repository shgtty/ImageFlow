<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #111;
        }

        /* 右下のフローティングボタンのコンテナ */
        #fab-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        /* 非アクティブ時にボタンを非表示にするクラス */
        #fab-container.hidden {
            opacity: 0;
            pointer-events: none;
            /* 透明時はクリック不可にする */
        }

        /* 非アクティブ時にマウスカーソルを消すクラス */
        .hide-cursor {
            cursor: none;
        }

        /* スクロールバーを最初から常に非表示にする (表示切り替え時のレイアウトのズレを防止) */
        html {
            -ms-overflow-style: none;
            /* IE, Edge (Legacy) */
            scrollbar-width: none;
            /* Firefox */
        }

        html::-webkit-scrollbar {
            display: none;
            /* Chrome, Safari, Edge (Chromium) */
            width: 0;
            height: 0;
        }

        .fab-wrapper {
            position: relative;
        }

        .fab {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: #333;
            color: white;
            border: 2px solid #555;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            transition: all 0.2s ease;
            outline: none;
        }

        .fab:hover {
            background-color: #555;
            transform: scale(1.1);
        }

        .fab:focus-visible {
            outline: 2px solid #3498db;
            outline-offset: 2px;
        }

        .fab:active {
            transform: scale(0.95);
            background-color: #777;
        }

        .fab svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        /* スピードメーターの表示 */
        #speed-indicator {
            position: absolute;
            right: 70px;
            /* ボタンの左側に表示 */
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.9em;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            white-space: nowrap;
        }

        /* 横3列、独立カラムレイアウト (Masonry風・画像の再配置を防ぐ) */
        #gallery {
            display: flex;
            width: 100%;
            padding-top: 20px; /* 切り替え時の密着感を解消 */
            justify-content: center; /* 少数の場合の中央寄せ */
            transition: opacity 0.3s ease; /* モード切替のフェード用 */
        }

        #gallery.rtl {
            flex-direction: row-reverse;
        }
        
        #gallery.loading {
            opacity: 0;
        }

        .gallery-col {
            flex: 1 1 0;
            display: flex;
            flex-direction: column;
        }

        #gallery img {
            width: 100%;
            height: auto;
            display: block;
            /* img下部の余白を消す */
            padding: 0;
            margin: 0;
            border: none;
            opacity: 0;
            /* フェードイン用: 初期は透明 */
            transition: opacity 0.6s ease-in-out;
            /* ゆっくり表示させる */
        }

        #gallery img.loaded {
            opacity: 1;
            /* フェードイン用: クラス追加で表示 */
        }

        .fab-row {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        #mode-overlay {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(20, 20, 20, 0.85);
            color: #fff;
            padding: 12px 30px;
            border-radius: 40px;
            font-size: 1.1em;
            font-weight: 600;
            z-index: 2000;
            pointer-events: none;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 12px;
            white-space: nowrap;
        }

        #mode-overlay.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        #mode-overlay .mode-icon {
            width: 24px;
            height: 24px;
            fill: #3498db;
        }

        #mode-overlay .image-count {
            margin-left: 8px;
        }

        #mode-overlay .filter-label {
            font-weight: bold;
            color: #3498db;
            margin-right: 5px;
        }

        /* シークバーのスタイル */
        #seekbar-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            max-width: 900px;
            height: 40px;
            background: rgba(20, 20, 20, 0.75);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 1000;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        #seekbar-container.user-hidden {
            transform: translateX(-50%) translateY(80px);
            opacity: 0;
            pointer-events: none;
        }

        #seekbar {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            outline: none;
            cursor: pointer;
        }

        #seekbar::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        #seekbar::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #3498db;
            margin-top: -6px;
            box-shadow: 0 0 15px rgba(52, 152, 219, 0.6);
            border: 2px solid #fff;
            transition: all 0.2s ease;
        }

        #seekbar:hover::-webkit-slider-thumb {
            transform: scale(1.2);
            background: #5dade2;
        }

        #seekbar-info {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85em;
            font-weight: 600;
            min-width: 100px;
            text-align: right;
            margin-left: 15px;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        #seekbar-tooltip {
            position: absolute;
            bottom: 50px;
            left: 0;
            background: rgba(40, 40, 40, 0.95);
            color: #fff;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: 600;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.1s ease;
            transform: translateX(-50%);
            white-space: nowrap;
            z-index: 2000;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
        }

        /* カウントダウンプログレスバー */
        #countdown-progress-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.05);
            z-index: 10000;
            pointer-events: none;
            overflow: hidden;
            display: none; /* デフォルトは非表示 */
        }

        #countdown-progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #3498db, #5dade2);
            box-shadow: 0 0 2px #3498db;
        }

        /* 色モードフィルタ */
        .color-mode-gray img {
            filter: grayscale(100%);
        }
        .color-mode-sepia img {
            filter: sepia(100%);
        }
        .color-mode-invert img {
            filter: invert(100%);
        }
        .color-mode-contrast img {
            filter: contrast(200%);
        }
        .color-mode-saturate img {
            filter: saturate(300%);
        }
        .color-mode-blur img {
            filter: blur(8px);
        }

        /* カーソル下のファイル名ツールチップ */
        #cursor-tooltip {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9em;
            font-weight: 500;
            white-space: nowrap; /* テキストを折り返さない */
            opacity: 0;
            transition: opacity 0.1s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transform: translate(15px, 15px); /* Offset from cursor */
        }

        /* 方向転換時のデカ矢印 */
        #direction-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3000;
            pointer-events: none;
            opacity: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #direction-overlay svg {
            width: 250px;
            height: 250px;
            fill: #fff;
            filter: drop-shadow(0 0 20px rgba(0, 0, 0, 0.8));
        }

        @keyframes arrow-fade-in-out {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            20% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.1); }
            80% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
        }

        #direction-overlay.animate {
            animation: arrow-fade-in-out 0.6s ease-out forwards;
        }

        /* フィルター情報バー */
        #filter-bar {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(10px);
            color: rgba(255, 255, 255, 0.9);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.85em;
            z-index: 1500;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 0;
            transform: translateX(-20px);
            max-width: 300px;
            line-height: 1.4;
        }

        #filter-bar.show {
            opacity: 1;
            transform: translateX(0);
        }

        #filter-bar .filter-label {
            font-weight: bold;
            color: #3498db;
            margin-right: 5px;
        }
    </style>
</head>

<body>
    <div id="mode-overlay" role="status" aria-live="polite"></div>
    <div id="cursor-tooltip"></div>
    <div id="direction-overlay"></div>

    <!-- カウントダウンプログレスバー -->
    <div id="countdown-progress-container">
        <div id="countdown-progress-bar"></div>
    </div>

    <!-- 右下のアイコンボタン群 -->
    <div id="fab-container">
        <!-- 上スクロールボタン -->
        <div class="fab-wrapper">
            <button class="fab" id="scrollUpBtn" title="上にスクロール (押すたびに加速)" aria-label="上にスクロール">
                <svg viewBox="0 0 24 24">
                    <path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z" />
                </svg>
            </button>
        </div>

        <!-- 停止ボタン -->
        <div class="fab-wrapper">
            <div id="speed-indicator">Speed: 0</div>
            <button class="fab" id="stopBtn" title="スクロール停止" aria-label="スクロール停止">
                <svg viewBox="0 0 24 24">
                    <path d="M6 6h12v12H6z" />
                </svg>
            </button>
        </div>

        <!-- 下スクロールボタン -->
        <div class="fab-wrapper">
            <button class="fab" id="scrollDownBtn" title="下にスクロール (押すたびに加速)" aria-label="下にスクロール">
                <svg viewBox="0 0 24 24">
                    <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z" />
                </svg>
            </button>
        </div>

        <!-- フルスクリーンボタン -->
        <div class="fab-wrapper">
            <button class="fab" id="fullscreenBtn" title="フルスクリーン切替 (Enter)" aria-label="フルスクリーン切替">
                <svg viewBox="0 0 24 24" id="fullscreenIcon">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
                </svg>
            </button>
        </div>

        <!-- ソート切替ボタン -->
        <div class="fab-wrapper">
            <button class="fab" id="sortBtn" title="ソート切替 (R)" aria-label="ソート切替">
                <svg viewBox="0 0 24 24" id="sortIcon">
                    <path
                        d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z" />
                </svg> <!-- ランダムアイコン(デフォルト) -->
            </button>
        </div>

        <!-- 列数変更ボタン -->
        <div class="fab-row" id="colBtnRow">
            <div class="fab-wrapper">
                <button class="fab" id="colMinusBtn" title="列を減らす (←)" aria-label="列を減らす">
                    <svg viewBox="0 0 24 24">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
                    </svg>
                </button>
            </div>
            <div class="fab-wrapper">
                <button class="fab" id="colPlusBtn" title="列を増やす (→)" aria-label="列を増やす">
                    <svg viewBox="0 0 24 24">
                        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- 表示順切替ボタン (Dual View専用) -->
        <div class="fab-wrapper" id="dirBtnWrapper" style="display: none;">
            <button class="fab" id="dirBtn" title="表示順切替 (O)" aria-label="表示順切替">
                <svg viewBox="0 0 24 24" id="dirIcon">
                    <path
                        d="M19 15l-3.5-3.5L14 13l2.5 2.5H5v2h11.5L14 20l1.5 1.5L19 18v-3zM5 9l3.5 3.5L10 11 7.5 8.5H19v-2H7.5L10 4 8.5 2.5 5 6v3z" />
                </svg>
            </button>
        </div>

        <!-- フィルター(include.txt)切替ボタン -->
        <div class="fab-wrapper">
            <button class="fab" id="includeToggleBtn" title="フィルター有効/無効 (F)" aria-label="フィルター切替">
                <svg viewBox="0 0 24 24" id="includeToggleIcon">
                    <path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z" />
                </svg>
            </button>
        </div>

        <!-- 表示モード切替ボタン -->
        <div class="fab-wrapper">
            <button class="fab" id="modeBtn" title="表示モード切替 (M)" aria-label="表示モード切替">
                <svg viewBox="0 0 24 24" id="modeIcon">
                    <path d="M4 11h5V5H4v6zm0 7h5v-6H4v6zm6 0h5v-6h10v6zm0-7h5V5h-5v6zm6-6v6h5V5h-5z" />
                </svg>
            </button>
        </div>

        <!-- シークバー切替ボタン -->
        <div class="fab-wrapper">
            <button class="fab" id="seekbarToggleBtn" title="シークバー表示切替 (S)" aria-label="シークバー表示切替">
                <svg viewBox="0 0 24 24" id="seekbarToggleIcon">
                    <rect x="2" y="11" width="20" height="2" rx="1" />
                    <circle cx="8" cy="12" r="5" />
                </svg>
            </button>
        </div>

        <!-- 色モード切替ボタン -->
        <div class="fab-wrapper">
            <button class="fab" id="colorModeBtn" title="色モード切替 (C)" aria-label="色モード切替">
                <svg viewBox="0 0 24 24">
                    <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1-.23-.27-.38-.62-.38-1 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
                </svg>
            </button>
        </div>

        <!-- カーソルツールチップ切替ボタン -->
        <div class="fab-wrapper">
            <button class="fab" id="cursorTooltipBtn" title="ファイル名表示切替 (I)" aria-label="ファイル名表示切替">
                <svg viewBox="0 0 24 24" id="cursorTooltipIcon">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                </svg>
            </button>
        </div>

        <!-- 再読み込みボタン -->
        <div class="fab-wrapper" style="margin-top: 10px;">
            <button class="fab" id="reloadBtn" title="画像を再読み込み" aria-label="画像を再読み込み">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
                </svg>
            </button>
        </div>
    </div>

    <!-- 画面下部のシークバー -->
    <div id="seekbar-container" class="user-hidden">
        <div id="seekbar-tooltip">0 / 0</div>
        <input type="range" id="seekbar" min="0" value="0" step="1" aria-label="画像シークバー">
        <div id="seekbar-info">0 / 0</div>
    </div>

    <div id="gallery"></div>

    <script src="js/utils.js"></script>
    <script src="js/dual-view.js"></script>
    <script src="js/gallery-view.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
